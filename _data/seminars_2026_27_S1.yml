- date: 9 Oct 2026
  speaker: Takeshi Koshizuka (RIKEN Center for Advanced Intelligence Project)
  url: https://sites.google.com/view/takeshi-koshizuka/
  zoom: 1
  title: "Connecting Distributions via Schrödinger Bridges: Which Path, and How to Learn It"
  abstract: "Transporting one probability distribution to another is a fundamental problem arising in population dynamics inference, generative modeling, and sampling from energy functions. Since infinitely many paths can connect two distributions, two essential questions arise: which path should we choose, and how can we learn it stably? This talk addresses both questions through the variational principles underlying optimal transport (OT) and Schrödinger bridges (SB).<br><br> In the first part, we start from Monge-Kantorovich OT and move to its Benamou-Brenier dynamic formulation. We then extend the transport cost to general Lagrangian costs, leading naturally to the Lagrangian Schrödinger bridge framework. We show how incorporating physical structure into the Lagrangian can select plausible transport paths, and introduce our Neural Lagrangian Schrödinger Bridge method.<br><br> In the second part, we revisit SB from a path-space optimization perspective. Viewing SB as a KL projection provides a unified interpretation of Sinkhorn and iterative proportional fitting (IPF) as alternating KL projections, and connects IPF to mirror descent. Building on this perspective, we introduce a Trust-Region Schrödinger Bridge Sampler for targets specified only through an energy function. By adaptively controlling the mirror-descent step size through a trust-region constraint, the method mitigates mode collapse and training instability in existing approaches."

- date: 16 Oct 2026
  speaker: Sam McCallum (University of Bath)
  url: https://sammccallum.github.io/
  zoom: 1
  title: Strong Stochastic Flow Maps
  abstract: Flow and diffusion models generate high-quality samples in many modalities; however, many network evaluations are required during inference due to numerical integration of an underlying differential equation. Flow maps alleviate this problem by learning the solution map of the differential equation directly. Yet, current methods are restricted to approximating the solution map of ODEs.<br><br> In this talk, we introduce a framework for learning the strong solution map of SDEs, termed Strong Stochastic Flow Maps. We apply this method to learn the solution map of diffusion models, allowing for few-step stochastic sampling. We additionally present some new work extending the method to Langevin dynamics and show that this can enable large-timestep molecular dynamics simulations.

- date: 23 Oct 2026
  speaker: Eviatar Bach (University of Reading)
  url: https://eviatarbach.com/
  zoom: 1
  title: "Learning Probabilistic Filters for Data Assimilation<br> (joint 'NA+DS+Stats' seminar, so will start at 1:15pm)"
  abstract: Filtering, the problem of estimating the probability distribution of a system's states given partial and noisy observations, is essential for weather forecasting, along with other areas of science and engineering. Obtaining the filtering distribution is generally intractable for high-dimensional, nonlinear systems. The ensemble Kalman filter (EnKF) approximates the filtering distribution with an ensemble of interacting particles, employing a Gaussian ansatz for the joint distribution of the state and observation at each observation time. The EnKF is robust, but the Gaussian ansatz limits accuracy. We address this shortcoming by using machine learning to map the forecast distribution and observation to the filtering distribution. We propose cost functions that are minimised uniquely at the true filtering distribution. By time-averaging over trajectories in ergodic dynamical systems, the map can be learned and subsequently used for future filtering; this is a form of amortised Bayesian inference. We focus on learning ensemble-based filters within a mean field framework. We demonstrate the approach using a set transformer neural architecture, which is invariant to ensemble permutations. The learned filtering algorithms outperform state-of-the-art methods for filtering chaotic systems. They also perform well in challenging highly non-Gaussian and multimodal problems where the EnKF fails. Once learned at a given ensemble size, the learned map can be applied to other ensemble sizes with minimal fine-tuning.

