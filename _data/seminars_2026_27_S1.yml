- date: 20 Nov 2026
  speaker: Bradley Earley (University of Bath)
  url: 
  zoom: 1
  title: "Improving the stability of exponential Ralston's method"
  abstract: "In this talk, we investigate two-stage second-order exponential integrators for semilinear ordinary differential equations, focusing on Ralston's parameter choice (α = 2/3). More specifically, we study the accuracy and stability of two variants derived using different interpolation choices for the ODE's nonlinearity. Through a stability analysis in the dissipative regime, we show that the stability region of our new 'exponential interpolation' method is a strictly larger than that of the standard 'linear interpolation' scheme. To conclude the talk, we discuss further applications including the implications of our results for nonlinear systems and the challenges of extending our results to time-evolving PDEs."

- date: 27 Nov 2026
  speaker: Luca Zanetti (University of Bath)
  url: https://researchportal.bath.ac.uk/en/persons/luca-zanetti/
  zoom: 1
  title: How fast can you mix on a metric space?
  abstract: "In the fastest mixing Markov chain problem on a graph (Boyd, Diaconis, and Xiao '04), we want to choose the transition probabilities of a random walk on the edges of a graph so that it converges as quickly as possible to a prescribed probability distribution on the vertices. This can be formulated as an eigenvalue optimisation problem and has found applications in, e.g., graph clustering, federated learning, and load balancing.<br><br> In this talk, we will discuss a generalisation to metric spaces. Given a complete metric space M, a probability measure on M, and a radius r, how quickly can a Markov chain converge to the prescribed measure if each jump has length at most r? We will see that the fastest possible mixing rate is essentially determined by two quantities: a geometric measure of how well connected the metric space is and a combinatorial notion of dimension."
"

