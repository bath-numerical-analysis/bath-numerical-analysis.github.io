- date: 6 Nov 2026
  speaker: Federico Cornalba (University of Bath)
  url: https://sites.google.com/view/federicocornalba/
  zoom: 1
  title: On reduced stochastic PDE models for stochastic Cucker-Smale flocking dynamics
  abstract: "Flocking refers to a phenomenon in collective motion where particles align their velocities with each other, commonly modelled using Cucker-Smale dynamics. In this talk, we introduce and analyse two general reduced stochastic PDE (SPDE) models for stochastic Cucker-Smale particle dynamics that encompass environmental and i.i.d.-type noises. Our models are computationally cheaper alternatives to the underlying particle system and preserve the flocking behaviour. To derive our reduced models, we consider suitable empirical particle densities which depend on position and time, but feature velocity dependency in a multiplicative fashion: this setup crucially allows for a very intuitive and convenient notion of flocking at the SPDE level. We discuss relevant analytical and numerical aspects of this SPDE setting. Based on a joint work with Kamran Arora (University of Bath) and Ana Djurdjevac (Oxford University)."

